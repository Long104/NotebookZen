name = "notebookzen-backend"
main = "src/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret env vars (safe to commit)
[vars]
FRONTEND_URL = "https://notebookzen.pantorn.site"

# Hyperdrive — connection pool to Supabase Postgres
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "8cec8ad2d9a5445d9bd8362fbbf5e090"

# Required secrets — deploy FAILS if any are missing.
# Set values via `wrangler secret put <KEY>` (NEVER in this file, NEVER in Terraform).
# Wrangler preserves secrets across deploys — they won't be wiped.
[secrets]
required = [
  "CLERK_SECRET_KEY",
  "CLERK_WEBHOOK_SECRET",
]
